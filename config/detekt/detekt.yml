build:
  maxIssues: 0

comments:
  active: true
  UndocumentedPublicClass:
    active: true
    excludes: ['**/test/**', '**/*Test/**', '**/build/**', '**/samples/**']
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
    searchInProtectedClass: false
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/test/**', '**/*Test/**', '**/build/**', '**/samples/**']
    searchProtectedFunction: false
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/test/**', '**/*Test/**', '**/build/**', '**/samples/**']
    searchProtectedProperty: false

style:
  ForbiddenImport:
    active: true
    imports:
      - value: 'kotlinx.coroutines.GlobalScope'
        reason: 'Structured concurrency only (docs/workflow.md §4.4)'
      - value: 'kotlinx.coroutines.runBlocking'
        reason: 'Not allowed in main source; permitted in tests, which are excluded via `excludes` (docs/workflow.md §4.4)'
    excludes: ['**/test/**', '**/commonTest/**', '**/*Test/**']
    forbiddenPatterns: '^(android|platform|com\.juul)\..*'
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'kotlin.io.println'
        reason: 'Use TeslaLogger (NFR-006)'
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false

potential-bugs:
  LateinitUsage:
    active: true
    excludes: ['**/test/**', '**/commonTest/**', '**/*Test/**']
  UnsafeCallOnNullableType:
    active: true
