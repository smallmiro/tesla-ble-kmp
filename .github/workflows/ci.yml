name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-37 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lintKotlin detekt forbiddenTokens --console=plain

  jvm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-37 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jvmTest --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: jvm-test-reports, path: '**/build/reports/tests/**' }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-37 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testAndroidHostTest :samples:android:assembleDebug --console=plain

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$XCODE_APP" ]; then
            echo "No /Applications/Xcode_26*.app found on this runner image" >&2
            ls /Applications | grep -i Xcode >&2 || true
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - run: ./gradlew iosSimulatorArm64Test apiCheck :sdk:linkDebugFrameworkIosSimulatorArm64 --console=plain
      - run: brew install xcodegen
      - run: cd samples/ios && xcodegen generate && xcodebuild -project TeslableSample.xcodeproj -scheme TeslableSample -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/check-license.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/scan-secrets.sh
