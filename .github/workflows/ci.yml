name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

# runner 선택 (ADR-0012): 기본은 self-hosted(Docker 'tesla-docker', macOS 'tesla-macos').
# 저장소 변수 CI_RUNNER=hosted 로 GitHub-hosted runner로 되돌린다.

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","tesla-docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-37.0 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lintKotlin detekt forbiddenTokens --console=plain

  jvm-test:
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","tesla-docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-37.0 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jvmTest --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: jvm-test-reports, path: '**/build/reports/tests/**' }

  android:
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","tesla-docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-37.0 build-tools;36.0.0' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testAndroidHostTest :samples:android:assembleDebug --console=plain
      - name: Merged manifest must not request INTERNET (NFR-014)
        run: |
          set -euo pipefail
          dir=samples/android/build/intermediates
          merged=$(find "$dir" -name AndroidManifest.xml -path '*merged_manifest*')
          if [ -z "$merged" ]; then
            echo "No merged AndroidManifest.xml under $dir; the check would pass vacuously" >&2
            exit 1
          fi
          if grep -rl --include=AndroidManifest.xml 'android.permission.INTERNET' "$dir"; then
            echo "android.permission.INTERNET is in the manifest(s) listed above (NFR-014: no network)" >&2
            exit 1
          fi
          echo "No INTERNET permission in the merged manifests"

  ios:
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'macos-15' || fromJSON('["self-hosted","macOS","tesla-macos"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode 26
        # sudo xcode-select 대신 DEVELOPER_DIR 을 쓴다. self-hosted runner에서는 sudo 암호를 입력할 수 없다.
        run: |
          set -euo pipefail
          XCODE_APP=""
          for app in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V -r) /Applications/Xcode.app; do
            [ -d "$app" ] || continue
            ver="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | awk 'NR==1 {print $2}')"
            case "$ver" in 26|26.*) XCODE_APP="$app"; break ;; esac
          done
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26 found under /Applications on this runner" >&2
            ls /Applications | grep -i Xcode >&2 || true
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version
      - run: ./gradlew iosSimulatorArm64Test apiCheck :sdk:linkDebugFrameworkIosSimulatorArm64 --console=plain
      - name: Teslable.framework must declare MinimumOSVersion 16.0 (NFR-009)
        run: |
          set -euo pipefail
          plist=sdk/build/bin/iosSimulatorArm64/debugFramework/Teslable.framework/Info.plist
          min="$(plutil -extract MinimumOSVersion raw -o - "$plist")"
          echo "MinimumOSVersion=$min"
          if [ "$min" != "16.0" ]; then
            echo "Expected MinimumOSVersion 16.0 in $plist, got '$min'" >&2
            exit 1
          fi
      - name: Ensure xcodegen
        # self-hosted(호스트 Mac)에는 미리 설치해 둔다. CI가 호스트에 brew install 하지 않는다.
        run: |
          if command -v xcodegen >/dev/null; then exit 0; fi
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then brew install xcodegen; exit 0; fi
          echo "xcodegen is not installed on this self-hosted runner (brew install xcodegen)" >&2
          exit 1
      - run: cd samples/ios && xcodegen generate && xcodebuild -project TeslableSample.xcodeproj -scheme TeslableSample -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Clean workspace on self-hosted runner
        if: always() && runner.environment == 'self-hosted'
        run: git clean -ffdxq

  license:
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","tesla-docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/check-license.sh

  secrets:
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","tesla-docker"]') }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/scan-secrets.sh
