name: TeslableSample
options:
  bundleIdPrefix: dev.mirolab
settings:
  base:
    # 샘플 앱 버전(앱 정보 화면에 표시). 실차 확인 빌드마다 CURRENT_PROJECT_VERSION을 올린다.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "10"
  deploymentTarget:
    iOS: "16.0"
targets:
  TeslableSample:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Teslable Sample
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 차량과 BLE로 통신하기 위해 블루투스가 필요합니다.
        # 모니터 앱(SFR-012): 백그라운드에서도 링크가 살아 있는 동안 수신을 이어 간다. 백그라운드 스캔·재연결은 실기기 스파이크 전까지 미확인.
        UIBackgroundModes: [bluetooth-central]
        # 로그 폴더(Documents/logs)를 Finder와 파일 앱에서 본다(SFR-016, SFR-017).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../sdk/build/bin/iosSimulatorArm64/debugFramework"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        # Teslable.framework은 iosSimulatorArm64 전용으로만 링크된다(Apple Silicon 시뮬레이터).
        # 'generic/platform=iOS Simulator' 목적지는 기본적으로 arm64+x86_64 유니버설을 시도하므로
        # x86_64 슬라이스가 없는 프레임워크와 링크가 실패한다. arm64로 제한한다.
        ARCHS: "arm64"
        EXCLUDED_ARCHS: "x86_64"
        ONLY_ACTIVE_ARCH: "YES"
    scheme:
      testTargets: [TeslableSampleTests]
    dependencies:
      - framework: ../../sdk/build/bin/iosSimulatorArm64/debugFramework/Teslable.framework
        embed: false
  TeslableSampleTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Tests]
    dependencies:
      - target: TeslableSample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../sdk/build/bin/iosSimulatorArm64/debugFramework"
        ARCHS: "arm64"
        EXCLUDED_ARCHS: "x86_64"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  TeslableSampleDevice:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    configFiles:
      Debug: Device.xcconfig
      Release: Device.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Teslable Sample
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 차량과 BLE로 통신하기 위해 블루투스가 필요합니다.
        # 모니터 앱(SFR-012): 백그라운드에서도 링크가 살아 있는 동안 수신을 이어 간다. 백그라운드 스캔·재연결은 실기기 스파이크 전까지 미확인.
        UIBackgroundModes: [bluetooth-central]
        # 로그 폴더(Documents/logs)를 Finder와 파일 앱에서 본다(SFR-016, SFR-017).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mirolab.TeslableSampleDevice
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: ../../sdk/build/bin/iosArm64/debugFramework/Teslable.framework
        embed: false
